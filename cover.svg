<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="50%" stop-color="#140607"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>

    <!-- Crimson Glow Gradient -->
    <radialGradient id="redGlow" cx="85%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4a0005" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftAccent" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#660000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Crimson Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d0a0d"/>
      <stop offset="50%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#3d0a0d"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a080a"/>
      <stop offset="100%" stop-color="#150405"/>
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 3px;
      fill: #ffffff;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 5px;
      fill: #ff4d5a;
      text-transform: uppercase;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 1.5px;
      fill: #f1b3b7;
    }
    .node-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #ff6b75;
      opacity: 0.85;
    }
  </style>

  <!-- Base Card Frame -->
  <rect x="2" y="2" width="996" height="276" rx="16" ry="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Glow Overlays -->
  <rect x="2" y="2" width="996" height="276" rx="16" ry="16" fill="url(#redGlow)" pointer-events="none"/>
  <rect x="2" y="2" width="996" height="276" rx="16" ry="16" fill="url(#leftAccent)" pointer-events="none"/>

  <!-- Neural Network & Model Graph Background Visual (Right Side) -->
  <g opacity="0.45">
    <!-- Connecting Synaptic Lines -->
    <line x1="680" y1="70" x2="770" y2="120" stroke="#8B0000" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="680" y1="140" x2="770" y2="120" stroke="#ff3344" stroke-width="1.2"/>
    <line x1="680" y1="210" x2="770" y2="120" stroke="#8B0000" stroke-width="1.2"/>
    <line x1="680" y1="140" x2="770" y2="190" stroke="#8B0000" stroke-width="1.2"/>
    <line x1="680" y1="210" x2="770" y2="190" stroke="#ff3344" stroke-width="1.2" stroke-dasharray="3 3"/>
    
    <line x1="770" y1="120" x2="870" y2="90" stroke="#ff3344" stroke-width="1.5"/>
    <line x1="770" y1="120" x2="870" y2="160" stroke="#8B0000" stroke-width="1.2"/>
    <line x1="770" y1="190" x2="870" y2="160" stroke="#ff3344" stroke-width="1.5"/>
    <line x1="770" y1="190" x2="870" y2="225" stroke="#8B0000" stroke-width="1.2" stroke-dasharray="3 3"/>

    <line x1="870" y1="90" x2="950" y2="140" stroke="#ff4d5a" stroke-width="1.8"/>
    <line x1="870" y1="160" x2="950" y2="140" stroke="#ff4d5a" stroke-width="1.8"/>
    <line x1="870" y1="225" x2="950" y2="140" stroke="#8B0000" stroke-width="1.2"/>

    <!-- Layer 1 Nodes (Inputs) -->
    <circle cx="680" cy="70" r="5" fill="#4a0005" stroke="#8B0000" stroke-width="1.5"/>
    <circle cx="680" cy="140" r="6" fill="#8B0000" stroke="#ff4d5a" stroke-width="1.5"/>
    <circle cx="680" cy="210" r="5" fill="#4a0005" stroke="#8B0000" stroke-width="1.5"/>

    <!-- Layer 2 Nodes (Hidden / Transformers) -->
    <circle cx="770" cy="120" r="8" fill="#66000a" stroke="#ff3344" stroke-width="2"/>
    <circle cx="770" cy="190" r="7" fill="#4a0005" stroke="#8B0000" stroke-width="1.5"/>

    <!-- Layer 3 Nodes (Attention Heads) -->
    <circle cx="870" cy="90" r="7" fill="#8B0000" stroke="#ff4d5a" stroke-width="2"/>
    <circle cx="870" cy="160" r="8" fill="#66000a" stroke="#ff3344" stroke-width="2"/>
    <circle cx="870" cy="225" r="5" fill="#4a0005" stroke="#8B0000" stroke-width="1.5"/>

    <!-- Layer 4 Output (Inference) -->
    <circle cx="950" cy="140" r="10" fill="#8B0000" stroke="#ff6b75" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="950" cy="140" r="4" fill="#ffffff"/>

    <!-- Labels for Architecture -->
    <text x="740" y="55" class="node-text">ATTN_WEIGHTS</text>
    <text x="840" y="255" class="node-text">LATENT_SPACE</text>
  </g>

  <!-- Left Side: Header Content -->
  <!-- Top Subtitle -->
  <text x="60" y="75" class="role-title">Aspiring AI Engineer  •  Full Stack Researcher</text>

  <!-- Main Name Title -->
  <text x="60" y="130" class="name-title">SURYAPRAKASH S</text>

  <!-- Tagline / Mission -->
  <text x="60" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a08587" letter-spacing="0.5">
    Architecting Deep Learning Models, Large Language Model Pipelines &amp; Scalable AI Systems
  </text>

  <!-- Red & Black Pill Badges for LLMs, AI, Models -->
  <g transform="translate(60, 195)">
    <!-- Pill 1: LLMs -->
    <g transform="translate(0, 0)">
      <rect width="140" height="34" rx="17" ry="17" fill="url(#badgeGrad)" stroke="#8B0000" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#ff4d5a"/>
      <text x="32" y="21" class="tag-text">LLM SYSTEMS</text>
    </g>

    <!-- Pill 2: Neural Models -->
    <g transform="translate(155, 0)">
      <rect width="170" height="34" rx="17" ry="17" fill="url(#badgeGrad)" stroke="#8B0000" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#ff4d5a"/>
      <text x="32" y="21" class="tag-text">NEURAL MODELS</text>
    </g>

    <!-- Pill 3: Computer Vision -->
    <g transform="translate(340, 0)">
      <rect width="175" height="34" rx="17" ry="17" fill="url(#badgeGrad)" stroke="#8B0000" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#ff4d5a"/>
      <text x="32" y="21" class="tag-text">COMPUTER VISION</text>
    </g>
  </g>
</svg>
